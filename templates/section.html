{% extends "base.html" %}

{% block title %}{{ section.title }}{% endblock title %}

{% block feed %}
  <link rel="alternate" type="application/atom+xml" href="{{ section.permalink }}atom.xml" title="{{ config.title }} - {{ section.title }}" />
  <link rel="alternate" type="application/rss+xml" href="{{ section.permalink }}index.xml" title="{{ config.title }} - {{ section.title }}" />
{%- endblock feed %}

{% block main %}
<content>
  <h1 class="sr-only">{{ section.title }}</h1>
  {{ <post_list pages={section.pages} /> }}
  <small>
    <div>
      {% set tags = get_taxonomy(kind="tags") %}
      {% for t in tags.items %}
      <a href="{{ t.permalink }}">#{{ t.name }}</a>&nbsp;
      {% endfor %}
    </div>
  </small>
</content>
{% endblock main %}
