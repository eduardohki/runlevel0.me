<style>
  /* Colour tokens shared by every page. Dark values apply on screen only,
     so a page printed from dark mode still comes out dark-on-white. */
  :root {
    --bg: #f2f3f4;
    --ink: #383838;          /* body text and headings */
    --muted: #6b6b6b;        /* dates, captions, attributions */
    --line: #d9dbe0;         /* dividers and outlines */
    --card: #ffffff;
    --card-edge: #c4c9d4;    /* neutral left edge of cards and quotes */
    --code-bg: #e4e6e8;
    --link: #324ab2;         /* solid link colour where the gradient can't show */
    --link-from: #324ab2;    /* the link gradient's two ends */
    --link-to: #2e2787;
    --link-grad: linear-gradient(135deg, var(--link-from) 0%, var(--link-to) 75%);
  }
  @media screen and (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1f27;
      --ink: #d3d5db;
      --muted: #8f94a0;
      --line: #3a3e4b;
      --card: #262934;
      --card-edge: #4a5060;
      --code-bg: #2e2f35;
      --link: #8cc2dd;
      --link-from: #a2becc;
      --link-to: #8cc2dd;
    }
  }

  body {
    font-family: Verdana, sans-serif;
    margin: auto;
    padding: 20px;
    max-width: 720px;
    text-align: left;
    background-color: var(--bg);
    word-wrap: break-word;
    overflow-wrap: break-word;
    font-size: 1.1em;
    font-weight: 400;
    line-break: normal;
    line-height: 1.5;
    color: var(--ink);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  strong,
  b {
    color: var(--ink);
  }

  /* Headings: tighter leading than body text, and more space above than below,
     so each heading belongs to the section it starts. */
  h1, h2, h3, h4 { line-height: 1.25; text-wrap: balance; }
  main h2, main h3 { margin: 1.5em 0 0.5em; }
  p, li, blockquote { text-wrap: pretty; }

  a {
    color: var(--link);
    text-decoration: none;
  }

  /* Gradient link text, on screen only. Printing drops backgrounds and high-contrast mode drops
     gradients, and either would leave the text transparent; there links keep their solid colour. */
  @media screen and (forced-colors: none) {
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      a {
        background-image: var(--link-grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    }
  }

  /* Keyboard focus in the link colour, clear of the text it surrounds. */
  :focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }

  .title {
    color: inherit;
    -webkit-text-fill-color: currentColor;
    text-decoration: none;
    border: 0;
  }

  .title span {
    font-weight: 400;
  }

  /* Text for screen readers only, e.g. '(opens in a new tab)'. */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Code blocks: lift Monokai's comment grey and keyword pink slightly so they meet contrast. */
  pre span[style*="color:#75715e"] { color: #9a957e !important; }
  pre span[style*="color:#f92672"] { color: #fb4b8b !important; }

  /* The nav sits at the top of every page; keep some room above it. */
  header > nav:first-child { margin-top: 1.5em; }

  /* The site title used to be an h2; keep its look without making it a heading. */
  .title .site-title {
    display: block;
    font-size: 1.5em;
    font-weight: bold;
    margin: 0.83em 0;
  }

  /* Links inside running text are underlined, so they don't rely on colour alone.
     Navigation-style link lists (nav, contact lines, blog index, CV chapter links) stay as they are. */
  main p a,
  main li a,
  main blockquote a {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }
  main .cv-links a,
  main .cv-legend a,
  main ul.blog-posts a {
    text-decoration: none;
  }

  nav a {
    margin-right: 10px;
    font-weight: bolder;
  }

  /* Touch screens: a 44px tall tap area for the nav links. Padding on an inline link
     doesn't move the line, content-box keeps the gradient sized to the text, and
     position: relative keeps the padding tappable where the next block starts close below. */
  @media (pointer: coarse) {
    nav a { position: relative; padding-block: 11px; background-origin: content-box; }
  }

  content {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  img {
    max-width: 100%;
  }

  code {
    font-family: "Source Code Pro", Consolas, "Ubuntu Mono", Menlo, "DejaVu Sans Mono", monospace, monospace;
    font-size: 16px;
    font-weight: 500;
    padding: 1px 4px 1px 4px;
    background-color: var(--code-bg);
    white-space: pre-wrap;
    overflow-x: auto;
  }

  pre code {
    color: var(--ink);
    display: block;
    padding: 20px;
    white-space: pre-wrap;
    font-family: "Source Code Pro", Consolas, "Ubuntu Mono", Menlo, "DejaVu Sans Mono", monospace, monospace;
    font-size: 14px;
    overflow-x: auto;
  }

  div.highlight pre {
    background-color: initial;
    color: initial;
  }

  div.highlight code {
    background-color: #232428;
    color: unset;
  }

  blockquote {
    border-left: 1px solid #999;
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 25px;
    text-align: center;
  }

  /* blog posts */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  @media (prefers-color-scheme: dark) {
    div.highlight code {
      background-color: #17181a;
    }
  }
</style>
