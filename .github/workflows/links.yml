name: Check links

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: links
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: zola check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zola
        uses: $/.github/actions/setup-zola

      - name: Check internal and external links
        run: '"${RUNNER_TEMP}/zola" check'
