name: Deploy to GitHub Pages

# Only pushes to main (and manual runs, gated to main below) can build or deploy.
# There is deliberately no pull_request / pull_request_target trigger, so code
# from forks or other branches never runs with Pages or OIDC permissions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deny everything by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      # The footer's copyright year comes from the build date.
      TZ: Europe/Berlin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zola
        uses: $/.github/actions/setup-zola

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: '"${RUNNER_TEMP}/zola" build'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      pages: write # publish the uploaded artifact to GitHub Pages
      id-token: write # OIDC token deploy-pages uses to prove the deployment's origin
    # The github-pages environment is also restricted to the main branch in
    # repo settings, so a deploy from any other ref is refused server-side.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
