name: Deploy to GitHub Pages

# Only pushes to main (and manual runs, gated to main below) can build or deploy.
# There is deliberately no pull_request / pull_request_target trigger, so code
# from forks or other branches never runs with Pages or OIDC permissions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deny everything by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      ZOLA_VERSION: 0.23.6
      # sha256 of zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz. Zola publishes no checksums
      # file; this matches the digest GitHub records for the release asset.
      ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4
      # The footer's copyright year comes from the build date.
      TZ: Europe/Berlin
    steps:
      - name: Install Zola (checksum-verified)
        run: |
          tarball="${RUNNER_TEMP}/zola.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$tarball" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar --extract --gzip --file "$tarball" --directory "$RUNNER_TEMP" zola
          "${RUNNER_TEMP}/zola" --version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: '"${RUNNER_TEMP}/zola" build'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      pages: write # publish the uploaded artifact to GitHub Pages
      id-token: write # OIDC token deploy-pages uses to prove the deployment's origin
    # The github-pages environment is also restricted to the main branch in
    # repo settings, so a deploy from any other ref is refused server-side.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
