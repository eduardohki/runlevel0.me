name: Set up Zola
description: Install a pinned, checksum-verified Zola release as "$RUNNER_TEMP/zola".

runs:
  using: composite
  steps:
    - name: Install Zola (checksum-verified)
      shell: bash
      env:
        ZOLA_VERSION: 0.23.6
        # sha256 of zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz. Zola publishes no checksums
        # file; this matches the digest GitHub records for the release asset.
        ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4
      run: |
        tarball="${RUNNER_TEMP}/zola.tar.gz"
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
          --output "$tarball" \
          "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        echo "${ZOLA_SHA256}  ${tarball}" | sha256sum --check --strict -
        tar --extract --gzip --file "$tarball" --directory "$RUNNER_TEMP" zola
        "${RUNNER_TEMP}/zola" --version
