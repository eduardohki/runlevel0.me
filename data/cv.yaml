# Single source of truth for the CV page (/cv/).
# Edit here; the page is generated from this file.
#
# Per entry:
#   start / end   YYYY-MM (end: present for the current role). Drives the timeline bar
#                 and the years shown next to each skill.
#   summary       one line, shown on the card for skimming.
#   highlights    shown when the card is expanded.
#   hats          which focus areas the entry shows (keys from `hats` below).
#   tech          skills used. Use the same spelling everywhere so years add up.
#   timeline      set to false to keep a short, overlapping entry off the timeline bar.

contact:
  email: services@runlevel0.me
  # Conservative PDF version for recruiters, built from the LaTeX CV repo.
  pdf: /files/CV-Eduardo_Hernacki.pdf
  links:
    - label: LinkedIn
      url: https://linkedin.com/in/eduardohki
    - label: GitHub
      url: https://github.com/eduardohki

title: Software Engineer & Technical Leader
location: Munich, Germany

stats:
  - value: "2008"
    label: In Tech Since
  - value: "10+"
    label: Years in Software & Cloud
  - value: "5"
    label: Industries, Mostly Regulated
  - value: "6+"
    label: Years in Technical Leadership

# Skills panel: one row per group, in this order. Years are computed from the roles'
# `tech` tags, so a skill only shows years if roles list it with the same spelling.
skill_groups:
  - label: Software
    skills: [TypeScript, Python, Rust, Elixir, Gleam, Behavior-Driven Development, Event-Driven Architecture]
  - label: AI
    skills: [AI Agents, Claude Code, Spec-Driven Development, Amazon Bedrock AgentCore]
  - label: Cloud & DevOps
    skills: [AWS, AWS CDK, Serverless, Terraform, Kubernetes, Docker, CI/CD, Observability, Security & Compliance, Linux]

# Focus areas. Each entry lists the hats it shows.
hats:
  - key: software
    label: Software Engineering
  - key: cloud
    label: Cloud & Operations
  - key: leadership
    label: Technical Leadership
  - key: advisory
    label: Stakeholders & Advisory

chapters:
  - title: AI-Augmented Engineering
    period: 2026 - Present
    entries:
      - role: Lead AI Engineer
        org: SQUER
        context: For a Financial Services Client · Munich
        start: 2026-04
        end: present
        summary: Made AI coding agents part of everyday software delivery for dozens of developers across three engineering groups, and moved the AI agents built there to a managed cloud runtime.
        hats: [software, cloud, leadership, advisory]
        highlights:
          - Grew the use of AI coding agents (Claude Code) from zero to dozens of active developers across three engineering groups, splitting my time between building the tooling and enabling the teams using it.
          - Served as one of the client's AI Champions, shaping new ways of working across the business area and developing the AI agents that support them.
          - Designed and built, in TypeScript and Python on Claude Code and the Claude Agent SDK, a Spec-Driven Development pipeline that turns rough notes, business context and people's input into reviewable Given/When/Then specifications, Jira stories and a code branch per feature, then into code changes through separate implementation and verification stages, with bounded self-correction and autonomous runs.
          - Drove the move of these pipelines' AI agents to a managed cloud runtime (Amazon Bedrock AgentCore), owning it end to end from planning to execution across teams, so they could run reliably at scale, and built a web dashboard where teams inspect and validate the status of their agent runs.
          - Authored the contribution standards that let several teams extend the shared tooling safely, with clear interfaces between components and room for teams to adapt defaults to their needs.
        tech: [Claude Code, Claude Agent SDK, Strands Agents, Amazon Bedrock AgentCore, AWS, TypeScript, Python, AI Agents, Spec-Driven Development, Behavior-Driven Development]
        tech_used: "Amazon Bedrock AgentCore, Claude Code, Claude Agent SDK, Strands Agents, TypeScript, Python, AI Agent Development"

